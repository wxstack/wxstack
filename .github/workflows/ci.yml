name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: 构建与测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建全部包
        run: pnpm build
      - name: 类型检查
        run: pnpm typecheck
      - name: 单元测试
        run: pnpm test

  lint:
    name: 代码规范与发布自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome 检查
        run: pnpm lint
      - name: 构建（供 publint/attw 校验产物）
        run: pnpm build
      - name: 各包 publint + attw 双发行自检
        run: pnpm -r --no-bail lint:pkg
